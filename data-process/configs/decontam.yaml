# C-Eval 的固定中文套话在中文通用语料中会产生单一 8-gram 假阳性。人工复核显示
# 以下三源要求两个不同命中可保留全部已确认真污染，同时救回主要误杀。该阈值不能
# 全局应用，否则会降低英文、代码等其他来源对 C-Eval 污染的召回率。
source_min_distinct_hits:
  cci3-hq: {ceval: 2}
  skypile-150b: {ceval: 2}
  wikipedia-zh: {ceval: 2}
