# S6 首次物化目标：M3 档（top-10% 质量）确定性切出的 ~100B tokens 单一分布子集，
# 供 E1 缩放律 / E2 架构消融全部前置实验共用（保证可比性；D 轴由其子采样实现）。
# 选取规则与 M3 完全一致（top_k=0.10 全领域统一），仅总量目标缩到 100B——
# 各领域按比例配额（最大余数法），不足额域自动用深档补足到配额（shortfall 进 summary）。
#
# 首次物化命令（硬门全过后）：
#   PYTHONPATH=src /usr/bin/python3 -m yuformer_data.scale.driver \
#     --stage s6 --mix-config configs/mix_m3_e1_100b.yaml --workers 64 --out-root ../data/processed

mix_name: mix_m3_e1_100b_fast
total_tokens: 100_000_000_000
score_field: hybrid_v2
seed: yuformer

domains:
  web:
    weight: 0.86
    top_k: 0.10
  code:
    weight: 0.055
    top_k: 0.10
  math:
    weight: 0.018
    top_k: 0.10
  chinese:
    weight: 0.035
    top_k: 0.10
  academic:
    weight: 0.012
    top_k: 0.10
  books:
    weight: 0.005
    top_k: 0.10
  encyclopedia:
    weight: 0.008
    top_k: 0.10
  qa:
    weight: 0.004
    top_k: 0.10
  multilingual:
    weight: 0.003
    top_k: 0.10

curriculum:
  enabled: false
  method: random
  stage1_fraction: 0.0    # upstream_score 跨源语义不一致；正式基线使用确定性全局打乱

val:
  tokens_per_domain: 50_000_000
  max_fraction: 0.01

# 历史文件名保留以避免大产物路径迁移；正式重物化不再允许 E-17 豁免。
allow_e17_web: false
goldrule:
  per_domain_quota: 10_000_000
  sample_rate: 0.10          # 先确定性过采样，归并时每域按 hash 取至 quota
  min_total_rows: 10_000_000
allow_e17_code: false

length_audit:
  primary_context: 4096
  long_context_min_tokens: 1_000_000_000
