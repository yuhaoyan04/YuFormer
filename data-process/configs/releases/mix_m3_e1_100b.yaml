schema_version: 1
release_name: mix_m3_e1_100b-20261019
snapshot_root: data/processed
audit_scope:
  included_sources:
    - automathtext
    - cci3-hq
    - dclm-baseline
    - dolma-books
    - fineweb
    - fineweb-2
    - fineweb-edu
    - github-code
    - pes2o
    - proof-pile-2
    - stack-exchange
    - starcoderdata
    - wikipedia-en
    - wikipedia-zh
    - wikitext
  excluded_sources:
    arxiv-latex-corpus: local train.jsonl is 56,105,768,891 bytes versus 78,855,074,113 bytes at immutable revision 02b5b67c83a6f2736cb8db4f2b56faa601d4e4af; excluded from this release pending a complete redownload and upstream-stage rebuild
    c4: disabled in data_sources.yaml; redundant Common Crawl source was never admitted downstream
    pg19: disabled after incompatible raw-text ingestion; dolma-books supplies the books domain
    skypile-150b: immutable revision has 437 data files but the local/S0 roster has 436 and is missing data/2022-05_zh_head_0006.jsonl; excluded pending download and upstream-stage rebuild

