[project]
name = "yuformer-data-pipeline"
version = "0.1.0"
description = "YuFormer AI-native data governance pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
zst = ["zstandard"]
dev = ["pytest"]

[project.scripts]
yuformer-clean = "yuformer_data.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
