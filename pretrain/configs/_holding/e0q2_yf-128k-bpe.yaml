# E0-Q2 臂：yf-128k-bpe × 0.5B(pretrain-0.5b-vocab128k) × 4,805,361,664 tokens——128k 词表压缩率更高、流仅 4.81B tokens，容量即预算上限（E-73：iters 38146→18331）
run_name: e0q2-yf-128k-bpe
seed: 20260929

model:
  preset: pretrain-0.5b-vocab128k
  configs: ${YUFORMER_MODEL_CONFIGS}

out_dir: ${YUFORMER_PRETRAIN_OUT}

data:
  stages:
    - ${YUFORMER_TOKEN_STREAMS}/e0q2_yf-128k-bpe.tokens.bin
  meta:
    - ${YUFORMER_TOKEN_STREAMS}/e0q2_yf-128k-bpe.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 50
  val_max_tokens_per_domain: 20_000_000

optim:
  optimizer: muon
  lr: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  lr_schedule: constant
  min_lr_ratio: 0.1
  adam_betas: [0.9, 0.95]
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0

train:
  budget_tokens: 4805361664
  micro_batch_size: 4
  grad_accum: 16
  expected_iters: 18331
  activation_checkpointing: false
  bf16: true
  eval_every: 500
  log_every: 20
  save_every: 5000

parallel:
  world_size: 1
  sharding: no_shard
