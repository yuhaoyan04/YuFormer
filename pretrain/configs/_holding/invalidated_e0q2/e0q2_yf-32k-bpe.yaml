# E0-Q2 臂：yf-32k-bpe × 0.5B(pretrain-0.5b-vocab32k) × 9,999,745,024 tokens——固定算力词表对比（loss 曲线可比）；iters/budget 按流容量核定（E-73：预算=iters×262144 对平）
run_name: e0q2-yf-32k-bpe
experiment_status: invalidated
seed: 20260929

model:
  preset: pretrain-0.5b-vocab32k
  configs: ${YUFORMER_MODEL_CONFIGS}

out_dir: ${YUFORMER_PRETRAIN_OUT}

data:
  stages:
    - ${YUFORMER_TOKEN_STREAMS}/e0q2_yf-32k-bpe.tokens.bin
  meta:
    - ${YUFORMER_TOKEN_STREAMS}/e0q2_yf-32k-bpe.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 50
  val_max_tokens_per_domain: 20_000_000

optim:
  optimizer: muon
  lr: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  lr_schedule: constant
  min_lr_ratio: 0.1
  adam_betas: [0.9, 0.95]
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0

train:
  budget_tokens: 9999745024
  micro_batch_size: 8          # 2026-10-16: 1→8——compile+sel-recompute 快配置（E-75 实测 3.25×），全局 batch 262k 不变
  grad_accum: 8               # 2026-10-16: 64→8——随 mbs 同改；tokens/step 不变（E-73 钳制仍有效）
  expected_iters: 38146
  activation_checkpointing: false  # 2026-10-16: true→false（E-75）——与 selective_recompute 互斥，全层重算税 ~50% 不可接受
  bf16: true
  eval_every: 500
  log_every: 20
  save_every: 250           # 2026-10-16: 500→250——val@500 的显存尖峰是崩溃点（5 连崩全灭证据），checkpoint 必须在 val 之前落盘（E-25 续）
  compile: true            # 2026-10-16（E-75）：E-51 主杠杆 +9~13 MFU 点；实测 iter1 loss 与 mbs1 配置差 1e-4
  compile_mode: default    # max-autotune 与 FSDP 状态机冲突（E-51），default 已验证
  selective_recompute: mlp # E-49/E-51：省激活显存且无全层重算税；与 activation_checkpointing 互斥

parallel:
  world_size: 1
  sharding: no_shard
