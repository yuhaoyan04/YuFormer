data:
  epochs: 1
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  seq_len: 4096
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  val_max_tokens_per_domain: 20000000
  val_samples_per_domain: 50
model:
  configs: ${YUFORMER_MODEL_CONFIGS}
  preset: e2-l16-h1440
optim:
  adam_betas:
  - 0.9
  - 0.95
  clip_grad: 1.0
  lr: 0.0002
  lr_schedule: constant
  min_lr_ratio: 0.1
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  optimizer: muon
  warmup_steps: 1000
  weight_decay: 0.1
out_dir: ${YUFORMER_PRETRAIN_OUT}
parallel:
  sharding: no_shard
  world_size: 1
run_name: e2_l16_lf
seed: 20261001
train:
  activation_checkpointing: false
  bf16: true
  budget_tokens: 1000000000
  eval_every: 500
  expected_iters: 3814
  grad_accum: 32
  log_every: 50
  micro_batch_size: 2
  save_every: 10000
  selective_recompute: mlp
