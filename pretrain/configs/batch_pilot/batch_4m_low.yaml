run_name: batch_4m_low
backend: torchtitan-v0.3.0
seed: 20261001
model:
  preset: e1-200m
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 64
  val_max_tokens_per_domain: 20000000
optim:
  optimizer: adamw
  lr: 0.0024
  weight_decay: 0.1
  warmup_steps: 5
  lr_schedule: cosine
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0
  batch_pilot_resolution:
    method: sqrt_tokens_per_step
    base_lr: 0.0012
    base_tokens_per_step: 262144
    tokens_per_step: 4194304
    level_multiplier: 0.5
    lr_selection_sha256: a5259b3ad807841e2f94863cfa49b138db9f2ea854a150a3ec10841497aeb554
train:
  budget_tokens: 1996488704
  micro_batch_size: 4
  grad_accum: 256
  expected_iters: 476
  activation_checkpointing: false
  cuda_graphs: false
  bf16: true
  eval_every: 119
  log_every: 4
  save_every: 119
  keep_last_n: 2
  keep_every: 50000
parallel:
  world_size: 1
  sharding: full_shard
