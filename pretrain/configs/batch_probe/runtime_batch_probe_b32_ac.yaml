run_name: runtime-batch-probe-b32-ac
backend: torchtitan-v0.3.0
seed: 20261112
model:
  preset: pretrain-0.5b-cs336
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  stage_sample_limits:
  - 20480
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 128
  val_max_tokens_per_domain: 20000000
optim:
  optimizer: adamw
  lr: 0.0002
  weight_decay: 0.1
  warmup_steps: 2
  lr_schedule: cosine
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0
train:
  budget_tokens: 83886080
  micro_batch_size: 32
  grad_accum: 8
  expected_iters: 20
  activation_checkpointing: true
  bf16: true
  cuda_graphs: false
  eval_every: 20
  log_every: 1
  save_every: 20
  keep_last_n: 2
  keep_every: 0
parallel:
  world_size: 4
  sharding: full_shard
experiment_status: performance_qualification
