run_name: e1_perf_200m
backend: torchtitan-v0.3.0
seed: 20261001
model:
  preset: e1-200m
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 64
  val_max_tokens_per_domain: 20000000
optim:
  optimizer: adamw
  lr: 0.0048
  weight_decay: 0.1
  warmup_steps: 2
  lr_schedule: cosine
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0
  lr_resolution:
    method: log_linear_power_law_plus_batch_pilot
    pilot_selection_sha256: d839e0c4773d9f5df6583dfb566ef82fa7ced0ceb0b05b634ea399290e184518
    batch_selection_sha256: d93d7e085eb8cf7f37c54410a951dfb415c86ddb599be8a625e5e2739ba8a94a
    non_embedding_params: 142771456
    tokens_per_step: 262144
    batch_lr_factor: 4.407924366259461
train:
  budget_tokens: 8388608
  micro_batch_size: 4
  grad_accum: 16
  expected_iters: 32
  activation_checkpointing: false
  cuda_graphs: false
  bf16: true
  eval_every: 32
  log_every: 1
  save_every: 32
  keep_last_n: 2
  keep_every: 0
parallel:
  world_size: 1
  sharding: full_shard
experiment_status: performance_qualification
