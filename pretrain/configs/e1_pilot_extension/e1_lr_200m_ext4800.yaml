run_name: e1_lr_200m_ext4800
backend: torchtitan-v0.3.0
seed: 20261001
model:
  preset: e1-200m
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 64
  val_max_tokens_per_domain: 20000000
optim:
  optimizer: adamw
  lr: 0.0048
  weight_decay: 0.1
  warmup_steps: 19
  lr_schedule: cosine
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0
train:
  budget_tokens: 500000000
  micro_batch_size: 4
  grad_accum: 16
  expected_iters: 1907
  activation_checkpointing: false
  bf16: true
  cuda_graphs: false
  eval_every: 476
  log_every: 50
  save_every: 250
  keep_last_n: 2
  keep_every: 50000
parallel:
  world_size: 1
  sharding: full_shard
