run_name: q3_recovery_reference
backend: torchtitan-v0.3.0
experiment_status: qualification
seed: 20261021
model:
  preset: e1-50m
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/${YUFORMER_ARM_DATA}.meta.json
  val_dir: ${YUFORMER_TOKEN_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 8
  val_max_tokens_per_domain: 20000000
optim:
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.1
  warmup_steps: 2
  lr_schedule: cosine
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  clip_grad: 1.0
train:
  budget_tokens: 393216
  micro_batch_size: 1
  grad_accum: 1
  expected_iters: 24
  activation_checkpointing: false
  cuda_graphs: false
  bf16: true
  eval_every: 8
  log_every: 1
  save_every: 4
  keep_last_n: 3
  keep_every: 1000
parallel:
  world_size: 4
  sharding: full_shard
