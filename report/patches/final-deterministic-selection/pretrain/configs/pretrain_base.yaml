run_name: pretrain-final-1t
backend: torchtitan-v0.3.0
seed: 20260926
model:
  preset: pretrain-final
  configs: ${YUFORMER_MODEL_CONFIGS}
out_dir: ${YUFORMER_PRETRAIN_OUT}
data:
  require_release: true
  require_eod: true
  release_manifest: ${YUFORMER_DATA_RELEASE}
  tokenizer_gate: ${YUFORMER_TOKENIZER_GATE}
  token_stream_audit: ${YUFORMER_TOKEN_STREAM_AUDIT}
  stages:
  - ${YUFORMER_TOKEN_STREAMS}/warmup.tokens.bin
  - ${YUFORMER_TOKEN_STREAMS}/stable.tokens.bin
  - ${YUFORMER_TOKEN_STREAMS}/anneal.tokens.bin
  meta:
  - ${YUFORMER_TOKEN_STREAMS}/warmup.meta.json
  - ${YUFORMER_TOKEN_STREAMS}/stable.meta.json
  - ${YUFORMER_TOKEN_STREAMS}/anneal.meta.json
  stage_sample_limits:
  - 12207104
  - 174868480
  - 36620288
  val_dir: ${YUFORMER_VAL_STREAMS}
  seq_len: 4096
  epochs: 1
  val_samples_per_domain: 64
  val_max_tokens_per_domain: 20000000
  sampling_policy: block_permutation
  block_permutation_manifest: ${YUFORMER_TRAINING_BLOCK_MANIFEST}
optim:
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.1
  warmup_steps: 11921
  lr_schedule: wsd
  decay_steps: 35762
  min_lr_ratio: 0.1
  adam_betas:
  - 0.9
  - 0.95
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  clip_grad: 1.0
train:
  budget_tokens: 916258291712
  micro_batch_size: 8
  grad_accum: 16
  expected_iters: 218453
  activation_checkpointing: false
  bf16: true
  cuda_graphs: false
  eval_every: 2000
  log_every: 20
  save_every: 250
  keep_last_n: 2
  keep_every: 10000
  deterministic: true
parallel:
  fsdp_reshard_after_forward: never
  replicate_degree: 1
  shard_degree: 8
  sharding: full_shard
  world_size: 8
compile:
  enable: true
  components:
  - model
  backend: inductor
attention:
  sdpa_backend: flash_flex_swa
loss:
  num_chunks: 4
